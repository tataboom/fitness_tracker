<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Logbook</title>
<meta name="description" content="Personal strength-training tracker. Runs entirely on this device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Logbook">
<meta name="theme-color" content="#131719">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23131719'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%93%93%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light dark}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#E7EAE9; --surface:#F8F9F9; --surface-2:#DCE1E0; --ink:#14181A;
  --ink-2:#576165; --ink-3:#7B8588; --rule:#C5CCCB;
  --accent:#9E6416; --steel:#2B5163; --flag:#8B3728; --good:#3D6B4A;
  --on-accent:#ffffff; --on-good:#ffffff;
  --fd:"Oswald","Arial Narrow",sans-serif;
  --fb:"Spectral",Georgia,"Times New Roman",serif;
  --fm:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131719; --surface:#1C2225; --surface-2:#252C30; --ink:#E9EDEC;
  --ink-2:#97A2A6; --ink-3:#778286; --rule:#2E373B;
  --accent:#D9973A; --steel:#79ABBE; --flag:#DE8570; --good:#7FB68E;
  --on-accent:#231908; --on-good:#0f2413;
}}
:root[data-theme="dark"]{
  --bg:#131719; --surface:#1C2225; --surface-2:#252C30; --ink:#E9EDEC;
  --ink-2:#97A2A6; --ink-3:#778286; --rule:#2E373B;
  --accent:#D9973A; --steel:#79ABBE; --flag:#DE8570; --good:#7FB68E;
  --on-accent:#231908; --on-good:#0f2413;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
.app{max-width:660px;margin:0 auto;padding:18px 14px 120px}
h1,h2,h3,.lab,.nm,.tabs button,.daybadge{font-family:var(--fd);text-transform:uppercase}
h1{font-size:27px;font-weight:700;letter-spacing:.01em;margin:0;line-height:1}
h2{font-size:19px;font-weight:600;letter-spacing:.03em;margin:0}
h3{font-size:13px;font-weight:600;letter-spacing:.09em;margin:0;color:var(--ink-3)}
p{margin:0 0 10px}p:last-child{margin-bottom:0}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--accent)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap}
.sync{font-family:var(--fm);font-size:11px;letter-spacing:.04em;color:var(--ink-3)}

/* tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:11px 4px 12px;color:var(--ink-2);font-size:12.5px;font-weight:600;letter-spacing:.08em}
.tabs button[aria-selected=true]{color:var(--ink);border-top-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none}

/* session header */
.shead{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--steel);border-radius:3px;padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.shead.rest{border-top-color:var(--rule)}
.shead .when{font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.shead .tag{font-family:var(--fm);font-size:12.5px;color:var(--ink-2)}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .22s}
.prog{font-family:var(--fm);font-size:11.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.04em}

/* exercise */
.ex{background:var(--surface);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ex.done{border-color:var(--good)}
.exhead{display:flex;align-items:flex-start;gap:11px;padding:11px 13px}
.tick{flex:none;width:44px;height:44px;border:2px solid var(--rule);border-radius:6px;background:var(--surface-2);display:grid;place-items:center;margin-top:1px;padding:0;color:var(--on-good)}
.ex.done .tick{background:var(--good);border-color:var(--good)}
.tick svg{width:18px;height:18px;display:none}
.ex.done .tick svg{display:block}
.exmeta{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:500;letter-spacing:.02em;line-height:1.2;display:block}
.ex.done .nm{color:var(--ink-2)}
.rx{font-family:var(--fm);font-size:12.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
.logbox{padding:0 13px 12px}
.summary{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;text-align:left;padding:0 13px 12px;font-family:var(--fm);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.summary b{color:var(--ink);font-weight:600}
.summary em{font-style:normal;color:var(--ink-3);margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.howto{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:9px 13px;color:var(--ink-3);font-family:var(--fm);font-size:12px;letter-spacing:.05em;text-align:left}
.chev{display:inline-block;font-size:11px;transition:transform .18s}
.ex.open .howto{color:var(--ink)}
.ex.open .howto .chev{transform:rotate(90deg)}
.exbody{border-top:1px solid var(--rule);padding:13px;display:none;flex-direction:column;gap:13px}
.ex.open .exbody{display:flex}
.preline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:9px 12px}
.preline p{font-size:13px;color:var(--ink-2);margin:0;flex:1 1 180px}
.mini{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:7px 12px;font-family:var(--fd);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
/* skipped state */
.ex.skipped{border-style:dashed}
.ex.skipped .tick{background:var(--surface-2);border-color:var(--rule);color:var(--ink-3)}
.ex.skipped .tick svg{display:block}
.ex.skipped .nm{color:var(--ink-3)}
/* progression nudge + prefill */
.nudge{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--fm);font-size:12px;line-height:1.45;color:var(--ink-2);margin-bottom:9px}
.nudge.up{color:var(--ink)}
.nudge b{color:var(--accent);font-weight:600}
.apply{background:var(--accent);color:var(--on-accent);border:0;border-radius:3px;padding:7px 12px;font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.sets input[data-prefill]{color:var(--ink-3)}
/* exercise footer: rest + skip */
.exfoot{display:flex;align-items:center;gap:8px;margin-top:10px}
.restbtn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:7px 12px;font-family:var(--fm);font-size:12.5px;color:var(--ink)}
.skipbtn{margin-left:auto;background:none;border:0;color:var(--ink-3);font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:7px 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips span{font-family:var(--fm);font-size:11.5px;color:var(--ink-3);margin-right:2px}
.chip{background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:6px 12px;font-family:var(--fm);font-size:12.5px;color:var(--ink)}
.chip.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips input{flex:1 1 130px;min-width:0;font-family:var(--fm);font-size:14px;padding:7px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink)}
/* session notes */
.notes textarea{width:100%;min-height:80px;resize:vertical;font-family:var(--fb);font-size:15px;line-height:1.5;padding:10px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink)}
.notes textarea:focus{border-color:var(--accent);outline:none}
/* rest timer */
.timer{max-height:0;overflow:hidden;background:var(--ink);color:var(--bg);transition:max-height .22s ease}
.timer.show,.timer.done{max-height:80px}
.timer.done{background:var(--good);color:var(--on-good)}
.tbar{height:3px;background:rgba(127,127,127,.35)}
.tbar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.timer.done .tbar i{background:#fff}
.trow{display:flex;align-items:center;gap:10px;padding:9px 14px;max-width:660px;margin:0 auto}
.tlabel{flex:1;min-width:0;font-family:var(--fd);font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnum{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.tbtn{background:rgba(127,127,127,.28);color:inherit;border:0;border-radius:3px;padding:8px 11px;font-family:var(--fm);font-size:12.5px}
.app{padding-bottom:calc(var(--dockh, 56px) + 14px)}

/* sets */
table.sets{width:100%;border-collapse:collapse;font-family:var(--fm);font-variant-numeric:tabular-nums}
table.sets th{font-family:var(--fd);font-size:10px;letter-spacing:.11em;color:var(--ink-3);font-weight:600;text-align:left;padding:0 0 5px}
table.sets td{padding:3px 6px 3px 0}
table.sets td:first-child{width:34px;color:var(--ink-3);font-size:12.5px}
table.sets td:last-child{padding-right:0}
.sets input{width:100%;min-width:0;font-family:var(--fm);font-size:16px;font-variant-numeric:tabular-nums;padding:8px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink)}
.sets input:focus{border-color:var(--accent);outline:none}
.prev{font-family:var(--fm);font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}

/* figure */
.figwrap{background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:8px}
.figwrap svg{display:block;width:100%;height:auto}
.figcap{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:0 4px 4px}
.cues{font-size:14px;color:var(--ink-2);margin:0;padding-left:17px}
.cues li{margin-bottom:5px}
.cues li:last-child{margin-bottom:0}
.vid{font-family:var(--fm);font-size:12px;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;align-self:flex-start}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.calnav button{background:var(--surface);border:1px solid var(--rule);border-radius:3px;color:var(--ink);padding:6px 13px;font-family:var(--fm);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-family:var(--fm);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-align:center;text-transform:uppercase;padding-bottom:2px}
.cell{aspect-ratio:1;border:1px solid var(--rule);border-radius:3px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);padding:0;font-family:var(--fm);font-size:13px;font-variant-numeric:tabular-nums}
.cell.blank{border:0;background:none}
.cell.off{color:var(--ink-3);background:transparent}
.cell.train{border-color:var(--steel);border-width:1px}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cell.logged{background:var(--good);border-color:var(--good);color:#fff}
:root[data-theme="dark"] .cell.logged,
:root:not([data-theme="light"]) .cell.logged{color:#111}
.cell .daybadge{font-size:8.5px;letter-spacing:.04em;font-family:var(--fd);font-weight:600;line-height:1;color:var(--steel)}
.cell.logged .daybadge{color:inherit;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--fm);font-size:11px;color:var(--ink-3)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:2px;border:1px solid var(--rule);flex:none}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:14px}
.card h3{margin-bottom:9px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
label.f input{font-family:var(--fm);font-size:16px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:11px 16px;font-family:var(--fd);font-size:13.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn[disabled]{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:3px;padding:9px 11px}
.stat dt{font-family:var(--fd);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 2px}
.stat dd{font-family:var(--fm);font-size:19px;font-weight:600;margin:0;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--ink-2)}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:3px}
.tbl table{border-collapse:collapse;width:100%;min-width:330px;font-family:var(--fm);font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--rule)}
.tbl th{font-family:var(--fd);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockh,64px) + 16px);background:var(--ink);color:var(--bg);font-family:var(--fm);font-size:13px;padding:9px 15px;border-radius:4px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.backtoday{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:6px 13px;font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.calnav .mid{display:flex;flex-direction:column;align-items:center;gap:5px}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <h1>Iron Logbook</h1>
    <div class="sync" id="saveState">Saved on this phone</div>
  </div>

  <div class="view" id="v-today"></div>
  <div class="view" id="v-cal" hidden></div>
  <div class="view" id="v-body" hidden></div>
  <div class="view" id="v-data" hidden></div>
</div>

<div class="dock" id="dock">
  <div class="timer" id="timer" role="status" aria-live="polite"><div class="tbar"><i></i></div><div class="trow"><span class="tlabel"></span><span class="tnum mono"></span><button type="button" class="tbtn" id="tPlus">+30 s</button><button type="button" class="tbtn" id="tStop">Stop</button></div></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="today">Today</button>
    <button role="tab" aria-selected="false" data-v="cal">Calendar</button>
    <button role="tab" aria-selected="false" data-v="body">Body</button>
    <button role="tab" aria-selected="false" data-v="data">Data</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- program ---------- */
var PROGRAM = {
  upperA:{name:"Upper A",tag:"horizontal push & pull",ex:[
    ["bench","Barbell bench press",4,"6-8","2-3 min"],
    ["row","Barbell bent-over row",4,"8-10","2 min"],
    ["incdb","Incline dumbbell press",3,"10-12","90 s"],
    ["invrow","Inverted row",3,"max","90 s"],
    ["lat","Dumbbell lateral raise",3,"12-15","60 s"],
    ["preach","Preacher curl",3,"10-12","60 s"],
    ["ohext","Overhead dumbbell extension",3,"10-12","60 s"]]},
  lowerA:{name:"Lower A",tag:"squat pattern & core",ex:[
    ["bulg","Bulgarian split squat",3,"8-10 / leg","2 min"],
    ["goblet","Goblet squat",4,"12-15","90 s"],
    ["dbrdl","Dumbbell Romanian deadlift",4,"10-12","90 s"],
    ["stepup","Step-up onto bench",3,"10 / leg","60 s"],
    ["thrust","Barbell hip thrust",3,"12-15","90 s"],
    ["calf","Standing calf raise",4,"15-20","45 s"],
    ["plank","Plank",3,"30-60 s","45 s"]]},
  upperB:{name:"Upper B",tag:"vertical push & pull",ex:[
    ["ohp","Standing overhead press",4,"6-8","2-3 min"],
    ["onerow","Single-arm dumbbell row",4,"10-12 / side","90 s"],
    ["flatdb","Flat dumbbell press",3,"10-12","90 s"],
    ["pullover","Dumbbell pullover",3,"12-15","60 s"],
    ["invrowE","Inverted row, feet elevated",3,"max","90 s"],
    ["hammer","Hammer curl",3,"12","60 s"],
    ["skull","Lying triceps extension",3,"10-12","60 s"]]},
  lowerB:{name:"Lower B",tag:"hinge pattern & carries",ex:[
    ["bbrdl","Barbell Romanian deadlift",4,"8-10","2-3 min"],
    ["lunge","Reverse lunge",3,"10 / leg","90 s"],
    ["slbridge","Single-leg glute bridge",3,"12 / side","60 s"],
    ["tempo","Goblet squat, 3s lower",3,"12","90 s"],
    ["farmer","Farmer's carry",4,"40 m","60 s"],
    ["deadbug","Dead bug",3,"10 / side","45 s"]]}
};
var SCHEDULE={1:"upperA",2:"lowerA",4:"upperB",5:"lowerB"}; /* JS getDay: Mon=1 */

/* ---------- exercise detail: cues + drawn figure ---------- */
/* pose = [headX,headY, shX,shY, elX,elY, haX,haY, hipX,hipY, knX,knY, ftX,ftY] */
var EX={
 bench:{cues:["Set the stands so you unrack with your arms almost straight, then lower to the chest.","No collars on the bar: a failed rep must be able to roll off to the floor. Practise that escape with the empty bar first.","Shoulder blades pinched down into the bench, bar to the lower chest, not the throat.","Rep 8 is never a grind. Leave one in the tank every set. There are no safety catches here."],
   a:[34,52,48,54,40,44,50,45,78,57,94,70,94,96], b:[34,52,48,54,48,40,49,25,78,57,94,70,94,96], gear:"barH", bench:1, arrow:[68,44,68,28]},
 row:{cues:["Hinge to about 45 degrees, back flat, chest proud.","Pull the bar to the bottom of your ribs, not your chest.","Elbows travel back and past your body, not out wide.","Lower under control. No jerking with the lower back."],
   a:[26,40,38,46,38,60,38,74,60,56,60,76,60,96], b:[26,40,38,46,48,54,40,58,60,56,60,76,60,96], gear:"barH", arrow:[38,74,38,60]},
 incdb:{cues:["Backrest on the middle setting, roughly 30 to 45 degrees.","Dumbbells start level with the upper chest.","Press up and slightly together, elbows about 45 degrees from the body.","Slow on the way down. That is where the muscle is built."],
   a:[36,44,48,50,40,42,50,42,78,66,94,78,94,96], b:[36,44,48,50,48,38,50,24,78,66,94,78,94,96], gear:"db2", bench:2, arrow:[68,42,68,26]},
 invrow:{cues:["Bar in the stands at 110 cm. Before you hang on it, push down hard to check both cups are seated.","Lie underneath, grip just outside shoulder width, body dead straight.","Pull your chest up to touch the bar, squeeze, lower slow.","Walk your feet in to make it easier, out to make it harder."],

function P(p,i){return [p[i*2],p[i*2+1]];}
function limb(p,a,b,w,o){var A=P(p,a),B=P(p,b);return '<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B[0]+'" y2="'+B[1]+'" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" opacity="'+o+'"/>';}
function person(p,o){
  var h=P(p,0);

    '<circle cx="'+h[0]+'" cy="'+h[1]+'" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/>'+

/* ---------- state ---------- */
var SCHEMA=3;
var LSKEY="ironlog.v2";           /* keep the v2 key so existing data is read, then migrate in place */
var state={schema:SCHEMA,config:{start:"2026-11-02"},sessions:{},metrics:{}};
var openEx={},editEx={},skipUI={},calMonth=null,storageOk=true;

/* comma-and-junk-safe number parser: "30,7 kg" -> 30.7, "max" -> null, "" -> null */
function num(s){if(s==null)return null;var v=parseFloat(String(s).replace(",",".").replace(/[^0-9.\-]/g,""));return isFinite(v)?v:null;}

function todayISO(){return iso(new Date());}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
/* whole-day serial from a yyyy-mm-dd string via UTC, immune to daylight-saving shifts */
function dayNum(dstr){var p=String(dstr).split("-");return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5);}
function fmtLong(s){var d=parseISO(s);return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});}
function sessionFor(dstr){var d=parseISO(dstr);return SCHEDULE[d.getDay()]||null;}
function weekIdx(dstr){return Math.floor((dayNum(dstr)-dayNum(state.config.start))/7);}
/* a stored session counts as real training if any exercise was done, skipped, or has a logged set */
function hasLog(s){if(!s||!s.exercises)return false;return Object.keys(s.exercises).some(function(k){var r=s.exercises[k];return r.done||r.skipped||(r.sets||[]).some(function(x){return x.r!==""||x.w!=="";});});}
/* the ramp is keyed to how many times you have already trained THIS split day, not the calendar:
   1st time -> 2 sets, 2nd -> 3 sets, 3rd on -> full. So training early never forces a low-volume week later. */
function priorSessionsOfType(dstr,dayKey){var n=0;Object.keys(state.sessions).forEach(function(d){if(d>=dstr)return;var s=state.sessions[d];if(s&&s.day===dayKey&&hasLog(s))n++;});return n;}
function setsFor(dstr,target){var key=sessionFor(dstr);if(!key)return target;var n=priorSessionsOfType(dstr,key);if(n<=0)return Math.min(2,target);if(n===1)return Math.min(3,target);return target;}
function isRamp(dstr){var key=sessionFor(dstr);if(!key)return 0;var n=priorSessionsOfType(dstr,key);return n<=0?2:n===1?3:0;}

function migrate(o){
  /* fold any older shape forward; today only v2 (no schema field) exists */
  if(!o.schema){o.schema=2;}
  o.schema=SCHEMA;return o;
}
function loadLocal(){try{var r=localStorage.getItem(LSKEY);if(r){var o=JSON.parse(r);if(o&&typeof o==="object"){o=migrate(o);state.schema=SCHEMA;state.config=Object.assign(state.config,o.config||{});state.sessions=o.sessions||{};state.metrics=o.metrics||{};}}}catch(e){}}
function saveLocal(){try{state.schema=SCHEMA;localStorage.setItem(LSKEY,JSON.stringify(state));if(!storageOk){storageOk=true;setSaveState();}}catch(e){storageOk=false;setSaveState();}}
function setSaveState(){var el=document.getElementById("saveState");if(el)el.textContent=storageOk?"Saved on this phone":"NOT SAVING — storage is blocked";if(el)el.style.color=storageOk?"":"var(--flag)";}

/* debounced save (arguments ignored — kept so existing call sites need no change) */
var saveT=null;
function queue(){clearTimeout(saveT);saveT=setTimeout(saveLocal,300);}
function flushNow(){clearTimeout(saveT);saveLocal();}
function noop(){}

/* ---------- session data helpers ---------- */
function getSession(dstr){
  var key=sessionFor(dstr);if(!key)return null;
  var s=state.sessions[dstr];
  if(!s){s={date:dstr,day:key,exercises:{},updatedAt:0};}
  if(s.day!==key){s.day=key;}
  return s;
}
function exRec(s,id,n){
  if(!s.exercises[id])s.exercises[id]={sets:[],done:false,skipped:false,skipReason:""};
  var r=s.exercises[id];
  if(r.skipped===undefined){r.skipped=false;r.skipReason="";}
  while(r.sets.length<n)r.sets.push({w:"",r:""});
  /* grow only — never slice, so changing the ramp or start date can never delete a logged set */
  return r;
}
function isComplete(r){return !!r&&(r.done||r.skipped);}
/* a whole session counts as completed only if at least one exercise was actually done (all-skipped does not count) */
function sessionDone(s){if(!s||!s.day)return false;var P=PROGRAM[s.day];if(!P)return false;var all=P.ex.every(function(e){return isComplete(s.exercises[e[0]]);});var anyDone=P.ex.some(function(e){var r=s.exercises[e[0]];return r&&r.done;});return all&&anyDone;}
function commit(s){s.updatedAt=Date.now();state.sessions[s.date]=s;queue();}
function lastLog(exId,beforeDate){
  var ds=Object.keys(state.sessions).filter(function(d){var s=state.sessions[d];return d<beforeDate&&s.exercises&&s.exercises[exId]&&!s.exercises[exId].skipped;}).sort();
  for(var i=ds.length-1;i>=0;i--){
    var r=state.sessions[ds[i]].exercises[exId];
    var f=r.sets.filter(function(x){return x.w!==""||x.r!=="";});
    if(f.length)return {date:ds[i],sets:f};
  }
  return null;
}
function entFor(id){var d=viewDate||todayISO(),key=sessionFor(d);if(!key)return null;return PROGRAM[key].ex.filter(function(e){return e[0]===id;})[0]||null;}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtW(x){return String(Math.round(x*10)/10);}
/* "2-3 min" -> 120, "90 s" -> 90 */
function restSecs(str){var m=String(str).match(/(\d+)(?:\s*-\s*(\d+))?\s*(min|s)\b/);if(!m)return 90;return m[3]==="min"?(+m[1])*60:+m[1];}
/* top of the rep range, or null for max / distance targets */
function repTop(str){
  if(/max/i.test(str))return null;
  if(/\d\s*m\b/.test(str)&&!/min/.test(str))return null;
  var m=String(str).match(/(\d+)(?:\s*-\s*(\d+))?/);return m?+(m[2]||m[1]):null;

/* double progression: hit the top of the range on every set last time -> add the smallest jump (2 kg) */
function progression(id,ent,d){
  var last=lastLog(id,d);if(!last)return null;
  var top=repTop(ent[3]),gear=(EX[id]||{}).gear||"none";
  var reps=last.sets.map(function(x){return num(x.r);}).filter(function(n){return n!=null;});
  var ws=last.sets.map(function(x){return num(x.w);}).filter(function(n){return n!=null;});
  var w=ws.length?Math.max.apply(null,ws):null;
  var uniformW=ws.length===last.sets.length&&ws.every(function(x){return x===ws[0];});
  if(!reps.length)return {kind:"none",w:w,text:"Last time ("+last.date+"): "+(w!==null?fmtW(w)+" kg, ":"")+"no reps logged."};
  var repTxt=reps.join(", ");
  var allTop=top!==null&&reps.length===last.sets.length&&reps.every(function(n){return n>=top;});
  if(top===null){var tot=reps.reduce(function(a,b){return a+b;},0);return {kind:"beat",w:w,text:"Last time "+repTxt+". Beat <b>"+tot+"</b> total."};}
  if(gear==="none"||w===null){
    return allTop?{kind:"harder",w:w,text:"Every set hit "+top+" last time. Slow the reps down, or make it harder."}
                 :{kind:"hold",w:w,text:"Last time "+repTxt+". Aim for "+top+" on every set."};
  }
  if(allTop&&uniformW){var nw=Math.round((w+2)*10)/10;return {kind:"up",w:w,next:nw,text:"All sets hit "+top+" at "+fmtW(w)+" kg. Try <b>"+fmtW(nw)+" kg</b>."};}
  if(allTop&&!uniformW)return {kind:"hold",w:w,text:"Hit "+top+" everywhere but on mixed weights. Settle on one weight, then add 2 kg."};
  return {kind:"hold",w:w,text:"Last time "+(uniformW?fmtW(w)+" kg":"mixed")+" for "+repTxt+". Push every set to "+top+"."};
}

function sumLine(r){
  var reps=r.sets.map(function(x){return x.r||"&mdash;";}).join(", ");
  var ws=r.sets.map(function(x){return x.w;}).filter(function(x){return x!=="";});
  var anyR=r.sets.some(function(x){return x.r!=="";});
  if(!ws.length&&!anyR)return '<span>Done &middot; nothing logged</span>';
  var uniq=ws.filter(function(v,i){return ws.indexOf(v)===i;});
  var wtxt=ws.length?(uniq.length===1?uniq[0]+" kg":uniq.join("/")+" kg"):"bodyweight";
  return '<span><b>'+wtxt+'</b> &times; '+reps+'</span>';
}
function setsTable(id,e,r,n,d){
  var pg=progression(id,e,d),h="";
  var untouched=r.sets.every(function(x){return x.w===""&&x.r==="";});
  var last=untouched?lastLog(id,d):null;
  if(pg){h+='<div class="nudge '+pg.kind+'"><span>'+pg.text+'</span>'+
    (pg.kind==="up"?'<button type="button" class="apply" data-apply="'+id+'" data-w="'+pg.next+'">Use '+fmtW(pg.next)+'</button>':'')+'</div>';}
  h+='<table class="sets"><thead><tr><th>Set</th><th>Weight (kg)</th><th>Reps</th></tr></thead><tbody>';
  var rows=Math.max(n,r.sets.length);
  for(var i=0;i<rows;i++){
    var w=r.sets[i].w,pre="";
    if(w===""&&last){var lw=last.sets[Math.min(i,last.sets.length-1)].w;if(lw){w=lw;pre=' data-prefill="1"';}}
    h+='<tr><td>'+(i+1)+'</td>'+
       '<td><input inputmode="decimal" data-in="w" data-ex="'+id+'" data-i="'+i+'" value="'+esc(w)+'"'+pre+' placeholder="&mdash;"></td>'+
       '<td><input inputmode="numeric" data-in="r" data-ex="'+id+'" data-i="'+i+'" value="'+esc(r.sets[i].r||"")+'" data-was="'+(r.sets[i].r?"0":"1")+'" placeholder="&mdash;"></td></tr>';
  }
  return h+'</tbody></table>';
}
function bindToday(){
  var el=document.getElementById("v-today");
  el.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){
    var d=parseISO(viewDate||todayISO());d.setDate(d.getDate()+ +b.dataset.nav);viewDate=iso(d);renderToday();};});

    var id=b.dataset.toggle;openEx[id]=!openEx[id];renderToday();};});

  el.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){
    editEx[b.dataset.edit]=true;renderToday();};});
  el.querySelectorAll("[data-rest]").forEach(function(b){b.onclick=function(){
    var ent=entFor(b.dataset.rest);if(ent)startRest(restSecs(ent[4]),ent[1]);};});
  el.querySelectorAll("[data-skip]").forEach(function(b){b.onclick=function(){skipUI[b.dataset.skip]=true;renderToday();};});
  el.querySelectorAll("[data-skipcancel]").forEach(function(b){b.onclick=function(){delete skipUI[b.dataset.skipcancel];renderToday();};});
  el.querySelectorAll("[data-reason]").forEach(function(b){b.onclick=function(){doSkip(b.dataset.skipid,b.dataset.reason);};});
  el.querySelectorAll("[data-skipok]").forEach(function(b){b.onclick=function(){
    var inp=el.querySelector('[data-skipother="'+b.dataset.skipok+'"]');var v=inp?inp.value.trim():"";doSkip(b.dataset.skipok,v||"Other");};});
  el.querySelectorAll("[data-skipother]").forEach(function(inp){inp.onkeydown=function(ev){

  el.querySelectorAll("[data-apply]").forEach(function(b){b.onclick=function(){
    var id=b.dataset.apply,w=b.dataset.w,d=viewDate||todayISO(),s=getSession(d),ent=entFor(id);if(!s||!ent)return;
    var r=exRec(s,id,setsFor(d,ent[2]));r.sets.forEach(function(x){if(x.w==="")x.w=w;});commit(s);renderToday();toast("Loaded "+w+" kg into empty sets");};});

  if(st)st.onclick=function(){
    state.config.start=viewDate||todayISO();queue("c","app");renderToday();toast("Start date set to "+state.config.start);};
  var notes=document.getElementById("snotes");
  if(notes)notes.oninput=function(){var d=viewDate||todayISO(),s=getSession(d);if(!s)return;s.notes=notes.value;commit(s);};
  var bt=document.getElementById("backToday");
  if(bt)bt.onclick=function(){viewDate=null;renderToday();};
  var cs=document.getElementById("clearSession");
  if(cs)cs.onclick=function(){var d=viewDate||todayISO();if(!state.sessions[d]){toast("Nothing to clear");return;}if(confirm("Clear all logged sets and notes for "+fmtLong(d)+"? This cannot be undone.")){delete state.sessions[d];flushNow();openEx={};editEx={};skipUI={};renderToday();toast("Session cleared");}};
  el.querySelectorAll("input[data-in]").forEach(function(inp){
    inp.onchange=inp.oninput=function(){
      var d=viewDate||todayISO(),s=getSession(d);if(!s)return;
      var id=inp.dataset.ex,ent=entFor(id);if(!ent)return;
      var r=exRec(s,id,setsFor(d,ent[2]));
      /* first touch on this exercise: bank any pre-filled weights so weight and reps are saved together */
      el.querySelectorAll('input[data-in="w"][data-ex="'+id+'"][data-prefill]').forEach(function(pi){
        if(r.sets[+pi.dataset.i].w==="")r.sets[+pi.dataset.i].w=pi.value.trim();pi.removeAttribute("data-prefill");});
      r.sets[+inp.dataset.i][inp.dataset.in]=inp.value.trim();
      /* a set just got its first rep count: start the rest clock — today only, and never interrupt a running timer */
      if(inp.dataset.in==="r"&&inp.dataset.was==="1"&&inp.value.trim()!==""){inp.dataset.was="0";if(d===todayISO()&&!timer.active)startRest(restSecs(ent[4]),ent[1]);}
      commit(s);updateProgressBar();};});
}
function doSkip(id,reason){
  var d=viewDate||todayISO(),s=getSession(d),ent=entFor(id);if(!s||!ent)return;
  var r=exRec(s,id,setsFor(d,ent[2]));r.skipped=true;r.skipReason=reason;r.done=false;
  delete skipUI[id];editEx[id]=false;openEx[id]=false;commit(s);renderToday();checkComplete(s);
}
function checkComplete(s){
  if(sessionDone(s)){toast("Session complete. Well done.");stopRest();}
}
/* copy whatever is currently shown in this exercise's inputs into the record (so ticking Done never loses visible numbers) */
function bankVisible(id,r){document.querySelectorAll('input[data-in][data-ex="'+id+'"]').forEach(function(inp){var i=+inp.dataset.i,f=inp.dataset.in;if(r.sets[i]&&inp.value.trim()!=="")r.sets[i][f]=inp.value.trim();});}
function toggleDone(id){
  var d=viewDate||todayISO(),s=getSession(d),ent=entFor(id);if(!s||!ent)return;
  var r=exRec(s,id,setsFor(d,ent[2]));
  if(r.skipped){r.skipped=false;r.skipReason="";r.done=false;editEx[id]=true;}
  else{if(!r.done)bankVisible(id,r);r.done=!r.done;if(r.done){editEx[id]=false;openEx[id]=false;}}
  commit(s);renderToday();checkComplete(s);
}
function updateProgressBar(){
  var d=viewDate||todayISO(),key=sessionFor(d);if(!key)return;
  var s=getSession(d),P=PROGRAM[key],n=0;
  P.ex.forEach(function(e){if(isComplete(s.exercises[e[0]]))n++;});
  var b=document.querySelector("#v-today .bar i");if(b)b.style.width=Math.round(n/P.ex.length*100)+"%";
}

function weeklyAverages(rows){
  var buckets={};
  rows.forEach(function(r){var v=num(r[1]);if(v==null)return;var d=parseISO(r[0]);var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);

  return Object.keys(buckets).sort().reverse().map(function(k){
    var a=buckets[k];return [k,a.reduce(function(x,y){return x+y;},0)/a.length];});
}

  h+='<div class="card"><h3>Start date</h3><div class="row">'+
     '<label class="f">Programme begins<input id="cfgStart" type="date" value="'+esc(state.config.start)+'"></label></div>'+
     '<p class="note" style="margin-top:9px">Sessions show on Monday, Tuesday, Thursday and Friday, and you can log any of them any time. This date only drives the &ldquo;Week N of 12&rdquo; counter. The easing-in weeks are keyed to how many times you have actually trained each day, so training early never forces a light week later.</p></div>';
  h+='<div class="card"><h3>The programme</h3><p class="note">Every exercise, its sets, reps and cues live in this app. The full write-up with loading tables and the reasoning sits alongside it.</p>'+
     '<p style="margin-top:9px"><a class="vid" href="programme.html" target="_blank" rel="noopener">Open the programme write-up &#8599;</a></p></div>';
  el.innerHTML=h;
  document.getElementById("cfgStart").onchange=function(){
    if(!this.value)return;state.config.start=this.value;flushNow();renderCal();renderToday();toast("Start date updated");};
  document.getElementById("shareBk").onclick=shareBackup;
  document.getElementById("saveBk").onclick=function(){downloadJSON(JSON.stringify(exportPayload(),null,2),"iron-logbook-"+todayISO()+".json");markBackup();};
  document.getElementById("impBtn").onclick=function(){document.getElementById("impFile").click();};
  document.getElementById("impFile").onchange=function(){if(this.files&&this.files[0])doImport(this.files[0]);this.value="";};
  document.getElementById("copyJson").onclick=function(){
    var blob=JSON.stringify(exportPayload(),null,2);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(blob).then(function(){toast("Copied");markBackup();},function(){fallbackCopy(blob);});
    }else fallbackCopy(blob);};
}
function markBackup(){state.config.lastBackup=todayISO();flushNow();}
function downloadJSON(text,fname){try{var a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.href=url;a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1500);toast("Saved");}catch(e){var en=document.getElementById("expNote");if(en)en.textContent="Could not save a file here. Use Copy as text instead.";}}
function shareBackup(){
  var text=JSON.stringify(exportPayload(),null,2),fname="iron-logbook-"+todayISO()+".json",file=null;
  try{file=new File([text],fname,{type:"application/json"});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Iron Logbook backup"}).then(markBackup).catch(function(){});
  }else{downloadJSON(text,fname);markBackup();}
}
function doImport(file){
  var rd=new FileReader();
  rd.onload=function(){
    var o;try{o=JSON.parse(rd.result);}catch(e){toast("Not a valid backup file");return;}
    if(!o||o.app!=="iron-logbook"){toast("Not an Iron Logbook backup");return;}
    var added=0;
    if(o.sessions)Object.keys(o.sessions).forEach(function(d){var inc=o.sessions[d],cur=state.sessions[d];if(!cur||(inc.updatedAt||0)>=(cur.updatedAt||0)){state.sessions[d]=inc;added++;}});
    if(o.metrics)Object.keys(o.metrics).forEach(function(mk){var im=o.metrics[mk];if(!state.metrics[mk])state.metrics[mk]=im;else state.metrics[mk].days=Object.assign({},im.days||{},state.metrics[mk].days||{});});
    if(o.config&&o.config.start)state.config.start=o.config.start;
    flushNow();renderData();toast("Imported "+added+" sessions");
  };
  rd.readAsText(file);
}
function fallbackCopy(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied");markBackup();}catch(e){toast("Copy failed");}
  document.body.removeChild(ta);
}
function exportPayload(){
  return {app:"iron-logbook",schema:SCHEMA,appVersion:"1.0.0",exported:new Date().toISOString(),
    config:state.config,sessions:state.sessions,metrics:state.metrics,
    programme:Object.keys(PROGRAM).reduce(function(o,k){o[k]={name:PROGRAM[k].name,exercises:PROGRAM[k].ex.map(function(e){return {id:e[0],name:e[1],sets:e[2],reps:e[3],rest:e[4]};})};return o;},{})};
}

/* ---------- tabs / toast ---------- */
function switchTab(v){
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.v===v));});
  ["today","cal","body","data"].forEach(function(k){document.getElementById("v-"+k).hidden=(k!==v);});
  if(v==="today")renderToday();if(v==="cal")renderCal();if(v==="body")renderBody();if(v==="data")renderData();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){if(b.dataset.v==="today")viewDate=null;switchTab(b.dataset.v);};});
var toastT=null;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},1900);}

/* ---------- rest timer ---------- */
var timer={endAt:0,total:0,label:"",iv:null,fired:false,active:false,doneAt:0},actx=null,wl=null;
function unlockAudio(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!actx)actx=new C();if(actx.state==="suspended")actx.resume();}catch(e){}}
/* keep the screen awake during a rest so the countdown keeps ticking and the beep can fire (a phone-off screen freezes both) */
function acquireWake(){try{if("wakeLock" in navigator){navigator.wakeLock.request("screen").then(function(s){wl=s;s.addEventListener("release",function(){wl=null;});},noop);}}catch(e){}}
function releaseWake(){try{if(wl)wl.release();}catch(e){}wl=null;}
function buzz(){
  try{if(actx&&actx.state==="suspended")actx.resume();}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}
  try{if(!actx)return;var t=actx.currentTime;[0,0.22,0.44].forEach(function(o){
    var osc=actx.createOscillator(),g=actx.createGain();osc.type="sine";osc.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t+o);g.gain.exponentialRampToValueAtTime(0.35,t+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.17);
    osc.connect(g);g.connect(actx.destination);osc.start(t+o);osc.stop(t+o+0.19);});}catch(e){}
}
function startRest(secs,label){
  unlockAudio();acquireWake();
  timer.endAt=Date.now()+secs*1000;timer.total=secs;timer.label=label;timer.fired=false;timer.doneAt=0;timer.active=true;
  clearInterval(timer.iv);timer.iv=setInterval(tickTimer,250);tickTimer();
}
function stopRest(){
  timer.active=false;clearInterval(timer.iv);releaseWake();
  var el=document.getElementById("timer");if(el)el.className="timer";
}
function tickTimer(){
  if(!timer.active)return;
  var el=document.getElementById("timer"),rem=Math.ceil((timer.endAt-Date.now())/1000);
  var num=el.querySelector(".tnum"),lab=el.querySelector(".tlabel"),bar=el.querySelector(".tbar i");
  if(rem<=0){
    if(!timer.fired){timer.fired=true;timer.doneAt=Date.now();buzz();}
    el.className="timer done";lab.textContent="Go — "+timer.label;num.textContent="0:00";bar.style.width="0%";
    if(timer.doneAt&&Date.now()-timer.doneAt>8000)stopRest();
    return;
  }
  el.className="timer show";lab.textContent="Rest — "+timer.label;
  num.textContent=Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0");
  bar.style.width=Math.max(0,Math.min(100,rem/timer.total*100))+"%";
}
document.getElementById("tPlus").onclick=function(){
  if(!timer.active)return;var now=Date.now();timer.endAt=Math.max(timer.endAt,now)+30000;timer.total+=30;timer.fired=false;timer.doneAt=0;tickTimer();};
document.getElementById("tStop").onclick=stopRest;
/* returning to the app: re-grab the wake lock (it auto-releases when hidden) and repaint the countdown */
document.addEventListener("visibilitychange",function(){if(!document.hidden&&timer.active){acquireWake();tickTimer();}});

/* keep .app's bottom padding matched to the dock's true rendered height (tabs + timer,
   when shown) so the tab bar is never hidden or overlapped, regardless of viewport quirks */
(function(){
  var dock=document.getElementById("dock");
  function apply(h){document.documentElement.style.setProperty("--dockh",Math.ceil(h)+"px");}
  if(window.ResizeObserver){
    new ResizeObserver(function(entries){apply(entries[0].contentRect.height);}).observe(dock);
  }else{
    apply(dock.offsetHeight);window.addEventListener("resize",function(){apply(dock.offsetHeight);});
  }
})();

/* ---------- boot ---------- */
loadLocal();
setSaveState();
renderToday();
/* ask the browser to keep this data (best-effort; not granted everywhere) */
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
/* never lose the last debounced write when the app is backgrounded or closed */
window.addEventListener("pagehide",flushNow);
document.addEventListener("visibilitychange",function(){if(document.hidden)flushNow();});
/* offline + installable via the service worker; prompt when a new version is ready */
if("serviceWorker" in navigator){window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){var nw=reg.installing;if(!nw)return;
      nw.addEventListener("statechange",function(){if(nw.state==="installed"&&navigator.serviceWorker.controller)toast("Update ready — close and reopen");});});
  }).catch(noop);
});}
</script>
</body>
