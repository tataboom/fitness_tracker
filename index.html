<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Logbook · Your home-gym companion</title>
<meta name="description" content="A clearer plan. A better rep. Your home-gym companion with movement guides, workout logging and progress insights.">
<meta name="theme-color" content="#172c25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Logbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/styles.css">
<script defer src="src/poses.js"></script>
<script defer src="src/catalog.js"></script>
<script defer src="src/model.js"></script>
<script defer src="src/app.js"></script>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<aside class="sidebar" aria-label="App sidebar">
<a class="brand" href="#today"><img src="icons/mark.svg" width="38" height="38" alt=""><span>iron<span class="brand-light">logbook</span><small>YOUR STRONGER EVERYDAY</small></span></a>
<div class="nav-label">YOUR SPACE</div><nav id="desktop-nav" aria-label="Main navigation"></nav>
<div class="sidebar-bottom"><div class="gym-mini"><span class="status-dot"></span> Your home gym<small>Built around what you have.</small></div><button class="nav-item" data-route="settings" id="settings-nav"></button></div>
</aside>
<div class="workspace">
<header class="topbar"><a href="#today" class="mobile-brand"><img src="icons/mark.svg" width="32" height="32" alt="">ironlogbook</a><span class="breadcrumb">Your space <span>/</span> <b id="page-name">Overview</b></span><div class="top-actions"><span class="save-status" id="save-status" role="status"></span><button class="icon-button" data-route="settings" aria-label="Open settings" id="settings-button"></button><span class="avatar" aria-hidden="true" id="avatar">Y</span></div></header>
<div id="storage-warning" role="alert" hidden></div>
<main id="main" tabindex="-1"></main>
<footer class="page-footer">A little stronger, one session at a time.<span>Iron Logbook · Made for your home gym</span></footer>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
<section class="rest-timer" id="rest-timer" hidden aria-label="Rest timer"><span id="rest-icon"></span><div><small id="rest-label">REST & RESET</small><strong id="rest-time" role="timer">1:30</strong></div><button data-action="timer-add" class="timer-button">+30s</button><button data-action="timer-stop" class="timer-button" aria-label="Dismiss rest timer">×</button><i id="rest-progress"></i></section>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="card">Enable JavaScript to use your training log. Your data stays in this browser.</p></noscript>

</html>
